name: secret-scan
on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan dos commits do PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./gitleaks detect --source . --log-opts="origin/${BASE_REF}..HEAD" --redact -v --exit-code 1
